name: Job alerts

on:
  schedule:
    - cron: "30 3 * * *"   # ~09:00 IST (Actions cron drifts; job alerts have no deadline)
    - cron: "30 12 * * *"  # ~18:00 IST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print jobs in the log instead of sending"
        type: boolean
        default: false
      file_id:
        description: "Telegram file_id of a resume PDF (set by the worker)"
        type: string
        default: ""

concurrency:
  group: jobbie
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python main.py ${{ inputs.dry_run == true && '--dry-run' || '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_KEY: ${{ secrets.JOOBLE_KEY }}
          FILE_ID: ${{ inputs.file_id }}

      # seen-jobs + profile live in the repo so runs stay stateless
      - run: |
          git config user.name "jobbie-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/state.json data/profile.json data/jobs.csv
          if ! git diff --cached --quiet; then
            git commit -m "state: $(date -u +%FT%H:%M)"
            git push
          fi
